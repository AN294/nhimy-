<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Nhimy Revisar — reveja e consolide o que você estudou."
  >

  <title>Revisar — Nhimy</title>

  <link rel="stylesheet" href="/css/base/variables.css">
  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/typography.css">

  <link rel="stylesheet" href="/css/layout/container.css">
  <link rel="stylesheet" href="/css/layout/header.css">
  <link rel="stylesheet" href="/css/layout/sections.css">

  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/components/forms.css">
  <link rel="stylesheet" href="/css/components/messages.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <a href="/" class="brand" aria-label="Nhimy">
        <span class="brand-name">Nhimy</span>
      </a>

      <nav class="desktop-nav" aria-label="Navegação principal">
        <a href="/">Estudante</a>
        <a href="/estudar/" class="active">Estudar</a>
        <a href="/trabalhos/">Trabalhos</a>
        <a href="/organizar/">Organizar</a>
        <a href="/ferramentas/">Ferramentas</a>
      </nav>

      <button
        class="menu-button"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
      >
        ☰
      </button>

    </div>
  </header>


  <main>

    <section class="student-hero">
      <div class="container hero-content">

        <span class="section-kicker">Revisar</span>

        <h1>Revise o que você estudou.</h1>

        <p>
          Retome as ideias principais e prepare-se para
          continuar aprendendo.
        </p>

      </div>
    </section>


    <section class="student-section">
      <div class="container">

        <div class="section-heading">

          <span class="section-kicker">Seu material</span>

          <h2>Conteúdo para revisão</h2>

          <p>
            O conteúdo preparado pelo Nhimy aparecerá aqui.
          </p>

        </div>


        <div class="form-group">

          <label class="form-label" for="reviewContent">
            Material
          </label>

          <textarea
            id="reviewContent"
            rows="14"
            readonly
            placeholder="O conteúdo para revisão aparecerá aqui..."
          ></textarea>

        </div>


        <div class="action-grid">

          <button
            class="btn btn-secondary"
            type="button"
            id="reviewBack"
          >
            Voltar
          </button>

          <button
            class="btn btn-primary"
            type="button"
            id="reviewNext"
          >
            Continuar →
          </button>

        </div>

      </div>
    </section>

  </main>


  <script type="module" src="/estudar/revisar/app.js"></script>

</body>
</html>
