<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Nhimy Explicar — compreenda assuntos difíceis de forma clara."
  >

  <title>Explicar — Nhimy</title>

  <link rel="stylesheet" href="/css/base/variables.css">
  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/typography.css">

  <link rel="stylesheet" href="/css/layout/container.css">
  <link rel="stylesheet" href="/css/layout/header.css">
  <link rel="stylesheet" href="/css/layout/sections.css">

  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/components/forms.css">
  <link rel="stylesheet" href="/css/components/messages.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <a href="/" class="brand" aria-label="Nhimy">
        <span class="brand-name">Nhimy</span>
      </a>

      <nav class="desktop-nav" aria-label="Navegação principal">
        <a href="/">Estudante</a>
        <a href="/estudar/" class="active">Estudar</a>
        <a href="/trabalhos/">Trabalhos</a>
        <a href="/organizar/">Organizar</a>
        <a href="/ferramentas/">Ferramentas</a>
      </nav>

      <button
        class="menu-button"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
      >
        ☰
      </button>

    </div>
  </header>


  <main>

    <section class="student-hero">
      <div class="container hero-content">

        <span class="section-kicker">Explicar</span>

        <h1>Entenda melhor.</h1>

        <p>
          Transforme assuntos difíceis em explicações claras
          e fáceis de compreender.
        </p>

      </div>
    </section>


    <section class="student-section">
      <div class="container">

        <div class="section-heading">
          <span class="section-kicker">Seu conteúdo</span>

          <h2>O que você quer entender?</h2>

          <p>
            Cole um texto, conceito ou assunto para começar.
          </p>
        </div>


        <div class="tool-panel">

          <label for="explainText">
            Conteúdo
          </label>

          <textarea
            id="explainText"
            rows="10"
            placeholder="Cole aqui o conteúdo que você quer entender..."
          ></textarea>

          <div class="tool-actions">

            <button
              id="explainStart"
              class="button button-primary"
              type="button"
            >
              Explicar →
            </button>

          </div>

        </div>


        <div
          id="explainResult"
          class="tool-panel"
          hidden
        >

          <div class="section-heading">
            <span class="section-kicker">Sua explicação</span>

            <h2>Entenda o assunto</h2>
          </div>

          <div id="explainOutput"></div>

        </div>

      </div>
    </section>

  </main>


  <script type="module" src="/estudar/explicar/app.js"></script>

</body>
</html>
